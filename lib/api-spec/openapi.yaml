openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: ShoeFlow Manager API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: whatsapp
    description: WhatsApp connection operations
  - name: groups
    description: WhatsApp groups management
  - name: automations
    description: Automation rules
  - name: contacts
    description: Contacts and providers
  - name: messages
    description: Messages and forwarding
  - name: dashboard
    description: Dashboard stats and aggregates
  - name: ai
    description: AI assistant operations
  - name: flujos
    description: Agent multi-step flows

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /dashboard/stats:
    get:
      operationId: getDashboardStats
      tags: [dashboard]
      summary: Get overall dashboard statistics
      responses:
        "200":
          description: Dashboard stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardStats"

  /dashboard/activity:
    get:
      operationId: getDashboardActivity
      tags: [dashboard]
      summary: Get recent activity timeline
      responses:
        "200":
          description: Activity feed
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ActivityItem"

  /whatsapp/sessions:
    get:
      operationId: getWhatsappSessions
      tags: [whatsapp]
      summary: Get all WhatsApp sessions
      responses:
        "200":
          description: Sessions list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WhatsappSession"
    post:
      operationId: createWhatsappSession
      tags: [whatsapp]
      summary: Create a new WhatsApp session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WhatsappSessionInput"
      responses:
        "201":
          description: Session created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WhatsappSession"

  /whatsapp/sessions/{id}:
    get:
      operationId: getWhatsappSession
      tags: [whatsapp]
      summary: Get a WhatsApp session
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WhatsappSession"
    delete:
      operationId: deleteWhatsappSession
      tags: [whatsapp]
      summary: Delete a WhatsApp session
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /whatsapp/sessions/{id}/qr:
    get:
      operationId: getSessionQr
      tags: [whatsapp]
      summary: Get QR code for a session
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: QR data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QrCode"

  /groups:
    get:
      operationId: listGroups
      tags: [groups]
      summary: List all WhatsApp groups
      parameters:
        - name: sessionId
          in: query
          schema:
            type: integer
        - name: category
          in: query
          schema:
            type: string
        - name: search
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Groups list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Group"
    post:
      operationId: createGroup
      tags: [groups]
      summary: Manually register a group
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GroupInput"
      responses:
        "201":
          description: Group created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Group"

  /groups/{id}:
    get:
      operationId: getGroup
      tags: [groups]
      summary: Get a single group
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Group
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Group"
    patch:
      operationId: updateGroup
      tags: [groups]
      summary: Update group metadata
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GroupUpdate"
      responses:
        "200":
          description: Updated group
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Group"

  /groups/stats:
    get:
      operationId: getGroupStats
      tags: [groups]
      summary: Get groups activity summary
      responses:
        "200":
          description: Group stats
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GroupStat"

  /automations:
    get:
      operationId: listAutomations
      tags: [automations]
      summary: List all automations
      responses:
        "200":
          description: Automations list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Automation"
    post:
      operationId: createAutomation
      tags: [automations]
      summary: Create a new automation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AutomationInput"
      responses:
        "201":
          description: Automation created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Automation"

  /automations/{id}:
    get:
      operationId: getAutomation
      tags: [automations]
      summary: Get a single automation
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Automation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Automation"
    patch:
      operationId: updateAutomation
      tags: [automations]
      summary: Update an automation
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AutomationUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Automation"
    delete:
      operationId: deleteAutomation
      tags: [automations]
      summary: Delete an automation
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /automations/{id}/toggle:
    post:
      operationId: toggleAutomation
      tags: [automations]
      summary: Toggle automation active state
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Toggled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Automation"

  /flujos:
    get:
      operationId: listFlujos
      tags: [flujos]
      summary: List all agent flows
      responses:
        "200":
          description: Flows list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Flujo"
    post:
      operationId: createFlujo
      tags: [flujos]
      summary: Create a new agent flow
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FlujoInput"
      responses:
        "201":
          description: Flow created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Flujo"

  /flujos/{id}:
    patch:
      operationId: updateFlujo
      tags: [flujos]
      summary: Update an agent flow
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FlujoUpdate"
      responses:
        "200":
          description: Flow updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Flujo"
    delete:
      operationId: deleteFlujo
      tags: [flujos]
      summary: Delete an agent flow
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Flow deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /flujos/{id}/simular:
    post:
      operationId: simularFlujo
      tags: [flujos]
      summary: Simulate an agent flow
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FlujoSimulacionInput"
      responses:
        "200":
          description: Flow simulation result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FlujoSimulacionResult"

  /flujos/{id}/toggle:
    post:
      operationId: toggleFlujo
      tags: [flujos]
      summary: Toggle agent flow active state
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Toggled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Flujo"

  /contacts:
    get:
      operationId: listContacts
      tags: [contacts]
      summary: List contacts and providers
      parameters:
        - name: type
          in: query
          schema:
            type: string
            enum: [contact, provider]
        - name: search
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Contacts list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Contact"
    post:
      operationId: createContact
      tags: [contacts]
      summary: Create a contact
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContactInput"
      responses:
        "201":
          description: Contact created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Contact"

  /contacts/{id}:
    patch:
      operationId: updateContact
      tags: [contacts]
      summary: Update contact
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContactUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Contact"

  /messages/forwarded:
    get:
      operationId: listForwardedMessages
      tags: [messages]
      summary: List forwarded messages
      responses:
        "200":
          description: Messages list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ForwardedMessage"
    post:
      operationId: forwardMessage
      tags: [messages]
      summary: Forward a message to groups
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ForwardInput"
      responses:
        "201":
          description: Forwarding queued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ForwardedMessage"

  /messages/responses:
    get:
      operationId: listResponses
      tags: [messages]
      summary: List detected responses and availability
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [disponible, agotado, pendiente, confirmado]
      responses:
        "200":
          description: Responses list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ShoeResponse"

  /messages/responses/{id}:
    patch:
      operationId: updateResponse
      tags: [messages]
      summary: Update a response status
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResponseUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShoeResponse"

  /ai/chat:
    post:
      operationId: aiChat
      tags: [ai]
      summary: Chat with AI assistant about WhatsApp automations
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AiChatInput"
      responses:
        "200":
          description: AI response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiChatReply"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]

    SuccessResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
      required: [success]

    DashboardStats:
      type: object
      properties:
        whatsappsConectados:
          type: integer
        gruposSincronizados:
          type: integer
        mensajesReenviadosHoy:
          type: integer
        automatizacionesActivas:
          type: integer
        proveedoresDetectados:
          type: integer
        respuestasHoy:
          type: integer
        mensajesHoy:
          type: array
          items:
            $ref: "#/components/schemas/HourlyCount"
      required:
        - whatsappsConectados
        - gruposSincronizados
        - mensajesReenviadosHoy
        - automatizacionesActivas
        - proveedoresDetectados
        - respuestasHoy
        - mensajesHoy

    HourlyCount:
      type: object
      properties:
        hour:
          type: string
        count:
          type: integer
      required: [hour, count]

    ActivityItem:
      type: object
      properties:
        id:
          type: integer
        tipo:
          type: string
        descripcion:
          type: string
        grupoOrigen:
          type: ["string", "null"]
        grupoDestino:
          type: ["string", "null"]
        proveedor:
          type: ["string", "null"]
        referencia:
          type: ["string", "null"]
        timestamp:
          type: string
      required: [id, tipo, descripcion, timestamp]

    WhatsappSession:
      type: object
      properties:
        id:
          type: integer
        nombre:
          type: string
        numero:
          type: ["string", "null"]
        avatar:
          type: ["string", "null"]
        estado:
          type: string
          enum: [conectado, sincronizando, desconectado, reconectando]
        gruposSincronizados:
          type: integer
        creadoEn:
          type: string
        ultimaConexion:
          type: ["string", "null"]
      required: [id, nombre, estado, gruposSincronizados, creadoEn]

    WhatsappSessionInput:
      type: object
      properties:
        nombre:
          type: string
      required: [nombre]

    QrCode:
      type: object
      properties:
        qrData:
          type: ["string", "null"]
        status:
          type: string
        expiraEn:
          type: integer
      required: [status]

    Group:
      type: object
      properties:
        id:
          type: integer
        sessionId:
          type: integer
        jid:
          type: ["string", "null"]
        nombre:
          type: string
        descripcion:
          type: ["string", "null"]
        foto:
          type: ["string", "null"]
        categoria:
          type: ["string", "null"]
        participantes:
          type: integer
        mensajesDiarios:
          type: integer
        ultimaActividad:
          type: ["string", "null"]
        activo:
          type: boolean
        creadoEn:
          type: string
      required: [id, sessionId, nombre, participantes, mensajesDiarios, activo, creadoEn]

    GroupInput:
      type: object
      properties:
        sessionId:
          type: integer
        nombre:
          type: string
        jid:
          type: string
        categoria:
          type: string
        participantes:
          type: integer
      required: [sessionId, nombre]

    GroupUpdate:
      type: object
      properties:
        nombre:
          type: string
        categoria:
          type: string
        descripcion:
          type: string
        activo:
          type: boolean

    GroupStat:
      type: object
      properties:
        groupId:
          type: integer
        nombre:
          type: string
        mensajes:
          type: integer
        categoria:
          type: ["string", "null"]
      required: [groupId, nombre, mensajes]

    Automation:
      type: object
      properties:
        id:
          type: integer
        nombre:
          type: string
        descripcion:
          type: ["string", "null"]
        triggerTipo:
          type: string
          enum: [foto_referencia, respuesta_disponible, precio_proveedor, palabra_clave, primer_proveedor]
        palabrasClave:
          type: array
          items:
            type: string
        gruposOrigen:
          type: array
          items:
            type: string
        gruposDestino:
          type: array
          items:
            type: string
        ventanaMinutos:
          type: integer
        criterio:
          type: string
          enum: [mejor_precio, primer_respuesta, manual]
        mensajeConsulta:
          type: ["string", "null"]
        reenviarAlOrigen:
          type: boolean
        accion:
          type: string
          enum: [reenviar, guardar_contacto, notificar, marcar_prioridad]
        activa:
          type: boolean
        ejecuciones:
          type: integer
        ultimaEjecucion:
          type: ["string", "null"]
        creadaEn:
          type: string
      required:
        - id
        - nombre
        - triggerTipo
        - palabrasClave
        - gruposOrigen
        - gruposDestino
        - ventanaMinutos
        - criterio
        - reenviarAlOrigen
        - accion
        - activa
        - ejecuciones
        - creadaEn

    AutomationInput:
      type: object
      properties:
        nombre:
          type: string
        descripcion:
          type: string
        triggerTipo:
          type: string
          enum: [foto_referencia, respuesta_disponible, precio_proveedor, palabra_clave, primer_proveedor]
        palabrasClave:
          type: array
          items:
            type: string
        gruposOrigen:
          type: array
          items:
            type: string
        gruposDestino:
          type: array
          items:
            type: string
        accion:
          type: string
          enum: [reenviar, guardar_contacto, notificar, marcar_prioridad]
        ventanaMinutos:
          type: integer
        criterio:
          type: string
          enum: [mejor_precio, primer_respuesta, manual]
        mensajeConsulta:
          type: string
        reenviarAlOrigen:
          type: boolean
      required: [nombre, triggerTipo, palabrasClave, gruposOrigen, gruposDestino, accion]

    AutomationUpdate:
      type: object
      properties:
        nombre:
          type: string
        descripcion:
          type: string
        triggerTipo:
          type: string
          enum: [foto_referencia, respuesta_disponible, precio_proveedor, palabra_clave, primer_proveedor]
        palabrasClave:
          type: array
          items:
            type: string
        gruposOrigen:
          type: array
          items:
            type: string
        gruposDestino:
          type: array
          items:
            type: string
        accion:
          type: string
          enum: [reenviar, guardar_contacto, notificar, marcar_prioridad]
        activa:
          type: boolean
        ventanaMinutos:
          type: integer
        criterio:
          type: string
          enum: [mejor_precio, primer_respuesta, manual]
        mensajeConsulta:
          type: string
        reenviarAlOrigen:
          type: boolean

    Contact:
      type: object
      properties:
        id:
          type: integer
        nombre:
          type: string
        numero:
          type: string
        tipo:
          type: string
          enum: [contact, provider]
        grupoOrigen:
          type: ["string", "null"]
        clasificacion:
          type: ["string", "null"]
          enum: [rapido, confiable, frecuente, null]
        frecuenciaRespuesta:
          type: integer
        historial:
          type: integer
        activo:
          type: boolean
        creadoEn:
          type: string
      required: [id, nombre, numero, tipo, frecuenciaRespuesta, historial, activo, creadoEn]

    ContactInput:
      type: object
      properties:
        nombre:
          type: string
        numero:
          type: string
        tipo:
          type: string
          enum: [contact, provider]
        grupoOrigen:
          type: string
        clasificacion:
          type: string
          enum: [rapido, confiable, frecuente]
      required: [nombre, numero, tipo]

    ContactUpdate:
      type: object
      properties:
        nombre:
          type: string
        clasificacion:
          type: string
          enum: [rapido, confiable, frecuente]
        activo:
          type: boolean

    ForwardedMessage:
      type: object
      properties:
        id:
          type: integer
        contenido:
          type: string
        grupoOrigen:
          type: ["string", "null"]
        gruposDestino:
          type: array
          items:
            type: string
        estado:
          type: string
          enum: [pendiente, enviando, completado, fallido]
        progreso:
          type: integer
        timestamp:
          type: string
        proveedor:
          type: ["string", "null"]
        referencia:
          type: ["string", "null"]
      required: [id, contenido, gruposDestino, estado, progreso, timestamp]

    ForwardInput:
      type: object
      properties:
        contenido:
          type: string
        grupoOrigenId:
          type: integer
        gruposDestinoIds:
          type: array
          items:
            type: integer
      required: [contenido, gruposDestinoIds]

    ShoeResponse:
      type: object
      properties:
        id:
          type: integer
        referencia:
          type: string
        imagen:
          type: ["string", "null"]
        proveedorNombre:
          type: string
        proveedorNumero:
          type: string
        precio:
          type: ["string", "null"]
        grupoOrigen:
          type: string
        estado:
          type: string
          enum: [disponible, agotado, pendiente, confirmado]
        timestamp:
          type: string
        prioridad:
          type: boolean
      required:
        - id
        - referencia
        - proveedorNombre
        - proveedorNumero
        - grupoOrigen
        - estado
        - timestamp
        - prioridad

    ResponseUpdate:
      type: object
      properties:
        estado:
          type: string
          enum: [disponible, agotado, pendiente, confirmado]
        prioridad:
          type: boolean

    AiChatInput:
      type: object
      required: [message]
      properties:
        message:
          type: string
          minLength: 1
        conversationHistory:
          type: array
          items:
            $ref: "#/components/schemas/ChatMessage"

    ChatMessage:
      type: object
      required: [role, content]
      properties:
        role:
          type: string
          enum: [user, assistant]
        content:
          type: string

    AiChatReply:
      type: object
      required: [message]
      properties:
        message:
          type: string

